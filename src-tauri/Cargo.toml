[package]
name = "flash-launcher"
version = "0.6.0"
description = "A Metro-style launcher for Flash games"
edition = "2021"

[lib]
name = "flash_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.42.0", features = ["bundled"] }
flate2 = "1.1.11"
lzma-rs = "0.3.0"
sha2 = "0.11.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls", "query"] }
